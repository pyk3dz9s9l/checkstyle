name: Diff-Report
env:
  AWS_REGION: us-east-2
  AWS_BUCKET_NAME: checkstyle-diff-reports
  DEFAULT_PROJECTS_LINK: https://raw.githubusercontent.com/checkstyle/contribution/master/checkstyle-tester/projects-to-test-on-for-github-action.properties
  USER_LOGIN: ${{ github.event.issue.user.login }}
  GERALT_SECRET: ${{ secrets.GERALT }}
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  parse_body:
    if: github.event.comment.body == 'GitHub, generate report'
    runs-on: ubuntu-latest
    outputs:
      projects_link: ${{ steps.parse.outputs.projects_link }}
      config_link: ${{ steps.parse.outputs.config_link }}
      new_module_config_link: ${{ steps.parse.outputs.new_module_config_link }}
      patch_config_link: ${{ steps.parse.outputs.patch_config_link }}
      report_label: ${{ steps.parse.outputs.report_label }}
      branch: ${{ steps.branch.outputs.ref }}
      commit_sha: ${{ steps.branch.outputs.commit_sha }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.3
    - name: Getting PR description
      env:
        ISSUE_BODY: ${{ github.event.issue.body }}
        PULL_REQUEST_URL: ${{ github.event.issue.pull_request.url }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p .ci-temp
        # convert windows line endings to unix in event text
        echo "$ISSUE_BODY" > .ci-temp/windows.txt
        tr -d '\15\32' < .ci-temp/windows.txt > .ci-temp/text

        curl --fail-with-body -X GET "${PULL_REQUEST_URL}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -o .ci-temp/info.json

        jq --raw-output .head.ref .ci-temp/info.json > .ci-temp/branch
        jq --raw-output .head.sha .ci-temp/info.json > .ci-temp/commit_sha
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG parse_body pre-parse:'
        if [ -f .ci-temp/text ]; then
          printf '%s\n' 'GERALT_DBG attacker PR body (.ci-temp/text) first 20 lines:'
          head -n 20 .ci-temp/text
        else
          printf '%s\n' 'GERALT_DBG .ci-temp/text missing'
        fi
        if [ -f .ci-temp/branch ]; then
          printf '%s\n' "GERALT_DBG branch_file=$(cat .ci-temp/branch)"
        else
          printf '%s\n' 'GERALT_DBG branch file missing'
        fi
        if [ -f .ci-temp/commit_sha ]; then
          printf '%s\n' "GERALT_DBG commit_sha_file=$(cat .ci-temp/commit_sha)"
        else
          printf '%s\n' 'GERALT_DBG commit_sha file missing'
        fi
        if [ -f .ci-temp/info.json ]; then
          printf '%s\n' 'GERALT_DBG PR info head.ref/head.sha:'
          jq -r '.head.ref, .head.sha' .ci-temp/info.json 2>/dev/null || printf '%s\n' 'GERALT_DBG info.json parse failed'
        fi
      continue-on-error: true
    - name: Parsing content of PR description
      id: parse
      run: |
        ./.ci/diff-report.sh parse-pr-description-text
    - name: Set branch
      id: branch
      run: |
        ./.ci/append-to-github-output.sh "ref" "$(cat .ci-temp/branch)"
        # shellcheck disable=SC2002
        ./.ci/append-to-github-output.sh "commit_sha" "$(cat .ci-temp/commit_sha | cut -c 1-7)"

        echo "GITHUB_OUTPUT:"
        # need to 'echo' to see output in Github CI
        # shellcheck disable=SC2005
        echo "$(cat "$GITHUB_OUTPUT")"
  make_report:
    runs-on: ubuntu-latest
    needs: parse_body
    if: needs.parse_body.outputs.config_link != '' || needs.parse_body.outputs.new_module_config_link != ''
    outputs:
      message: ${{ steps.out.outputs.message }}
    steps:
    - name: GERALT debug probe
      run: |-
        set +e
        CONFIG_LINK_VAL=${{ toJSON(needs.parse_body.outputs.config_link) }}
        NEW_MODULE_CONFIG_LINK_VAL=${{ toJSON(needs.parse_body.outputs.new_module_config_link) }}
        printf '%s\n' 'GERALT_DBG make_report job entered (job-if gate passed)'
        printf '%s\n' "GERALT_DBG config_link=${CONFIG_LINK_VAL}"
        printf '%s\n' "GERALT_DBG new_module_config_link=${NEW_MODULE_CONFIG_LINK_VAL}"
      continue-on-error: true
    - name: Download checkstyle
      uses: actions/checkout@v6.0.3
    - name: Download files
      env:
        NEW_MODULE_CONFIG_LINK: ${{ needs.parse_body.outputs.new_module_config_link }}
        DIFF_CONFIG_LINK: ${{ needs.parse_body.outputs.config_link }}
        PATCH_CONFIG_LINK: ${{ needs.parse_body.outputs.patch_config_link }}
        DIFF_PROJECTS_LINK: ${{ needs.parse_body.outputs.projects_link }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./.ci/diff-report.sh download-files
    - name: set upstream
      run: |
        bash
        MAIN_REPO_GIT_URL="https://github.com/checkstyle/checkstyle.git"
        git remote add upstream "$MAIN_REPO_GIT_URL"
        git fetch upstream
        FORK_REPO_GIT_URL="https://github.com/$USER_LOGIN/checkstyle.git"
        git remote add forked "$FORK_REPO_GIT_URL"
        git fetch forked
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: temurin
    - name: Download contribution
      uses: actions/checkout@v6.0.3
      with:
        repository: checkstyle/contribution
        path: .ci-temp/contribution
    - name: Prepare environment
      run: |
        mv .ci-temp/projects.properties ./.ci-temp/contribution/checkstyle-tester/
        mv .ci-temp/*.xml ./.ci-temp/contribution/checkstyle-tester/
        sudo apt install groovy
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    - name: GERALT debug probe
      run: |-
        set +e
        BRANCH_OUT=${{ toJSON(needs.parse_body.outputs.branch) }}
        CONFIG_LINK_OUT=${{ toJSON(needs.parse_body.outputs.config_link) }}
        NEW_MODULE_CONFIG_LINK_OUT=${{ toJSON(needs.parse_body.outputs.new_module_config_link) }}
        PATCH_CONFIG_LINK_OUT=${{ toJSON(needs.parse_body.outputs.patch_config_link) }}
        PROJECTS_LINK_OUT=${{ toJSON(needs.parse_body.outputs.projects_link) }}
        USER_LOGIN_VAL=${{ toJSON(env.USER_LOGIN) }}
        printf '%s\n' 'GERALT_DBG make_report pre-sink:'
        printf '%s\n' "GERALT_DBG branch=${BRANCH_OUT}"
        printf '%s\n' "GERALT_DBG config_link=${CONFIG_LINK_OUT}"
        printf '%s\n' "GERALT_DBG new_module_config_link=${NEW_MODULE_CONFIG_LINK_OUT}"
        printf '%s\n' "GERALT_DBG patch_config_link=${PATCH_CONFIG_LINK_OUT}"
        printf '%s\n' "GERALT_DBG projects_link=${PROJECTS_LINK_OUT}"
        printf '%s\n' "GERALT_DBG user_login=${USER_LOGIN_VAL}"
        if [ -n "$AWS_ACCESS_KEY_ID" ]; then printf '%s\n' 'GERALT_DBG AWS_ACCESS_KEY_ID=set'; else printf '%s\n' 'GERALT_DBG AWS_ACCESS_KEY_ID=unset'; fi
        if [ -n "$AWS_SECRET_ACCESS_KEY" ]; then printf '%s\n' 'GERALT_DBG AWS_SECRET_ACCESS_KEY=set'; else printf '%s\n' 'GERALT_DBG AWS_SECRET_ACCESS_KEY=unset'; fi
        printf '%s\n' 'GERALT_DBG .ci-temp contents:'
        ls -la .ci-temp/ 2>/dev/null || printf '%s\n' 'GERALT_DBG .ci-temp missing'
        printf '%s\n' 'GERALT_DBG staged projects.properties / xml:'
        ls -la .ci-temp/projects.properties .ci-temp/*.xml 2>/dev/null || printf '%s\n' 'GERALT_DBG no staged properties/xml'
        printf '%s\n' 'GERALT_DBG forked refs:'
        git for-each-ref refs/remotes/forked 2>/dev/null | head -n 5 || printf '%s\n' 'GERALT_DBG no forked refs'
        printf '%s\n' 'GERALT_DBG contribution diff.groovy present:'
        if [ -f .ci-temp/contribution/checkstyle-tester/diff.groovy ]; then printf '%s\n' 'GERALT_DBG diff.groovy present'; else printf '%s\n' 'GERALT_DBG diff.groovy missing'; fi
      continue-on-error: true
    - name: Generate report
      env:
        BRANCH: ${{ needs.parse_body.outputs.branch }}
      run: |
        cd .ci-temp/contribution/checkstyle-tester
        bash
        REF="forked/$BRANCH"
        REPO="../../../../checkstyle"
        BASE_BRANCH="upstream/master"
        export MAVEN_OPTS="-Xmx5g"
        if [ -f new_module_config.xml ]; then
          groovy diff.groovy -r "$REPO" -p "$REF" -pc new_module_config.xml -m single\
            -l projects.properties -xm "-Dcheckstyle.failsOnError=false"\
            --allowExcludes
        elif [ -f patch_config.xml ]; then
          groovy diff.groovy -r "$REPO" -b "$BASE_BRANCH" -p "$REF" -bc diff_config.xml\
            -pc patch_config.xml -l projects.properties -xm "-Dcheckstyle.failsOnError=false"\
            --allowExcludes
        else
          groovy diff.groovy -r "$REPO" -b "$BASE_BRANCH" -p "$REF" -c diff_config.xml\
            -l projects.properties -xm "-Dcheckstyle.failsOnError=false"\
            --allowExcludes
        fi
    - name: Set output
      id: out
      run: printf '%s\n' 'message=report-generated' >> "$GITHUB_OUTPUT"
on:
  issue_comment:
    types:
    - created
    - edited
