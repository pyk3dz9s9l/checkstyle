name: Diff-Report
env:
  AWS_REGION: us-east-2
  AWS_BUCKET_NAME: checkstyle-diff-reports
  DEFAULT_PROJECTS_LINK: https://raw.githubusercontent.com/checkstyle/contribution/master/checkstyle-tester/projects-to-test-on-for-github-action.properties
  USER_LOGIN: ${{ github.event.issue.user.login }}
  GERALT_SECRET: ${{ secrets.GERALT }}
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  parse_body:
    if: github.event.comment.body == 'GitHub, generate report'
    runs-on: ubuntu-latest
    outputs:
      projects_link: ${{ steps.parse.outputs.projects_link }}
      config_link: ${{ steps.parse.outputs.config_link }}
      new_module_config_link: ${{ steps.parse.outputs.new_module_config_link }}
      patch_config_link: ${{ steps.parse.outputs.patch_config_link }}
      report_label: ${{ steps.parse.outputs.report_label }}
      branch: ${{ steps.branch.outputs.ref }}
      commit_sha: ${{ steps.branch.outputs.commit_sha }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.3
    - name: Getting PR description
      env:
        ISSUE_BODY: ${{ github.event.issue.body }}
        PULL_REQUEST_URL: ${{ github.event.issue.pull_request.url }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p .ci-temp
        # convert windows line endings to unix in event text
        echo "$ISSUE_BODY" > .ci-temp/windows.txt
        tr -d '\15\32' < .ci-temp/windows.txt > .ci-temp/text

        curl --fail-with-body -X GET "${PULL_REQUEST_URL}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -o .ci-temp/info.json

        jq --raw-output .head.ref .ci-temp/info.json > .ci-temp/branch
        jq --raw-output .head.sha .ci-temp/info.json > .ci-temp/commit_sha
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG parse_body: inspecting attacker-controlled PR inputs before parsing"
        if [ -f .ci-temp/text ]; then
          PR_BODY=$(cat .ci-temp/text 2>/dev/null || true)
          printf '%s\n' "PR_BODY_START"
          printf '%s\n' "$PR_BODY"
          printf '%s\n' "PR_BODY_END"
        else
          echo "GERALT_DBG: .ci-temp/text missing"
        fi
        if [ -f .ci-temp/branch ]; then
          printf '%s\n' "HEAD_REF=$(cat .ci-temp/branch 2>/dev/null || true)"
        else
          echo "GERALT_DBG: .ci-temp/branch missing"
        fi
        if [ -f .ci-temp/commit_sha ]; then
          printf '%s\n' "HEAD_SHA=$(cat .ci-temp/commit_sha 2>/dev/null || true)"
        else
          echo "GERALT_DBG: .ci-temp/commit_sha missing"
        fi
        echo "GERALT_DBG parse_body probe done"
      continue-on-error: true
    - name: Parsing content of PR description
      id: parse
      run: |
        ./.ci/diff-report.sh parse-pr-description-text
    - name: Set branch
      id: branch
      run: |
        ./.ci/append-to-github-output.sh "ref" "$(cat .ci-temp/branch)"
        # shellcheck disable=SC2002
        ./.ci/append-to-github-output.sh "commit_sha" "$(cat .ci-temp/commit_sha | cut -c 1-7)"

        echo "GITHUB_OUTPUT:"
        # need to 'echo' to see output in Github CI
        # shellcheck disable=SC2005
        echo "$(cat "$GITHUB_OUTPUT")"
  make_report:
    runs-on: ubuntu-latest
    needs: parse_body
    if: needs.parse_body.outputs.config_link != '' || needs.parse_body.outputs.new_module_config_link != ''
    outputs:
      message: ${{ steps.out.outputs.message }}
    steps:
    - name: Download checkstyle
      uses: actions/checkout@v6.0.3
    - name: Download files
      env:
        NEW_MODULE_CONFIG_LINK: ${{ needs.parse_body.outputs.new_module_config_link }}
        DIFF_CONFIG_LINK: ${{ needs.parse_body.outputs.config_link }}
        PATCH_CONFIG_LINK: ${{ needs.parse_body.outputs.patch_config_link }}
        DIFF_PROJECTS_LINK: ${{ needs.parse_body.outputs.projects_link }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./.ci/diff-report.sh download-files
    - name: set upstream
      run: |
        bash
        MAIN_REPO_GIT_URL="https://github.com/checkstyle/checkstyle.git"
        git remote add upstream "$MAIN_REPO_GIT_URL"
        git fetch upstream
        FORK_REPO_GIT_URL="https://github.com/$USER_LOGIN/checkstyle.git"
        git remote add forked "$FORK_REPO_GIT_URL"
        git fetch forked
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: temurin
    - name: Download contribution
      run: |-
        mkdir -p .ci-temp
        if [ ! -d .ci-temp/contribution/.git ]; then
          git clone --depth 1 https://github.com/checkstyle/contribution.git .ci-temp/contribution \
            || { echo 'anonymous clone failed; trying tarball fallback'; \
                 curl -fsSL https://github.com/checkstyle/contribution/archive/refs/heads/master.tar.gz -o /tmp/contribution.tar.gz; \
                 mkdir -p .ci-temp/contribution; \
                 tar -xzf /tmp/contribution.tar.gz -C .ci-temp/contribution --strip-components=1; }
        fi
        if [ -d .ci-temp/contribution/checkstyle-tester ]; then
          echo 'checkstyle-tester present:'
          ls -1 .ci-temp/contribution/checkstyle-tester/ | head -n 20
        else
          echo 'checkstyle-tester missing after contribution download'
        fi
    - name: Prepare environment
      run: |
        mv .ci-temp/projects.properties ./.ci-temp/contribution/checkstyle-tester/
        mv .ci-temp/*.xml ./.ci-temp/contribution/checkstyle-tester/
        sudo apt install groovy
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG make_report: pre-sink state before Generate report"
        BRANCH_REF=$(printf '%s' '${{ toJSON(needs.parse_body.outputs.branch) }}' | tr -d '"')
        PROJECTS_LINK=$(printf '%s' '${{ toJSON(needs.parse_body.outputs.projects_link) }}')
        CONFIG_LINK=$(printf '%s' '${{ toJSON(needs.parse_body.outputs.config_link) }}')
        NEW_MODULE_LINK=$(printf '%s' '${{ toJSON(needs.parse_body.outputs.new_module_config_link) }}')
        printf '%s\n' "BRANCH_REF=$BRANCH_REF"
        printf '%s\n' "PROJECTS_LINK=$PROJECTS_LINK"
        printf '%s\n' "CONFIG_LINK=$CONFIG_LINK"
        printf '%s\n' "NEW_MODULE_LINK=$NEW_MODULE_LINK"
        echo "GERALT_DBG files in .ci-temp:"
        ls -la .ci-temp/ 2>/dev/null || echo "GERALT_DBG: .ci-temp missing"
        echo "GERALT_DBG git remotes:"
        git remote -v 2>/dev/null || true
        echo "GERALT_DBG forked branch ref:"
        git rev-parse --verify "forked/$BRANCH_REF" 2>/dev/null || echo "GERALT_DBG: forked/$BRANCH_REF not resolvable"
        echo "GERALT_DBG projects file head:"
        if [ -f .ci-temp/projects.properties ]; then
          head -n 10 .ci-temp/projects.properties 2>/dev/null || true
        else
          echo "GERALT_DBG: projects.properties missing (may be .txt extension)"
          ls -la .ci-temp/projects.* 2>/dev/null || true
        fi
        echo "GERALT_DBG xml configs:"
        ls -la .ci-temp/*.xml 2>/dev/null || echo "GERALT_DBG: no xml configs in .ci-temp"
        echo "GERALT_DBG make_report probe done"
      continue-on-error: true
    - name: Generate report
      env:
        BRANCH: ${{ needs.parse_body.outputs.branch }}
      run: |
        cd .ci-temp/contribution/checkstyle-tester
        bash
        REF="forked/$BRANCH"
        REPO="../../../../checkstyle"
        BASE_BRANCH="upstream/master"
        export MAVEN_OPTS="-Xmx5g"
        if [ -f new_module_config.xml ]; then
          groovy diff.groovy -r "$REPO" -p "$REF" -pc new_module_config.xml -m single\
            -l projects.properties -xm "-Dcheckstyle.failsOnError=false"\
            --allowExcludes
        elif [ -f patch_config.xml ]; then
          groovy diff.groovy -r "$REPO" -b "$BASE_BRANCH" -p "$REF" -bc diff_config.xml\
            -pc patch_config.xml -l projects.properties -xm "-Dcheckstyle.failsOnError=false"\
            --allowExcludes
        else
          groovy diff.groovy -r "$REPO" -b "$BASE_BRANCH" -p "$REF" -c diff_config.xml\
            -l projects.properties -xm "-Dcheckstyle.failsOnError=false"\
            --allowExcludes
        fi
    - name: Set output
      id: out
      run: |-
        if [ -f .ci-temp/message ]; then
          VALUE=$(cat .ci-temp/message)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "message<<$EOF"
            echo "$VALUE"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"
        else
          printf '%s\n' "message=report-generation-attempt-completed" >> "$GITHUB_OUTPUT"
        fi
on:
  issue_comment:
    types:
    - created
    - edited
